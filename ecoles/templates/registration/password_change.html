{% load static %}<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mot de passe · ScolaPay</title>
  <link rel="stylesheet" href="{% static 'ecoles/style.css' %}?v=1">
</head>
<body>
<div class="login-wrap">
  <div class="card login-card">
    <div class="brand-big">Scola<span>Pay</span></div>
    <h1 style="text-align:center">Changer mon mot de passe</h1>
    <form method="post">
      {% csrf_token %}
      {% include "ecoles/_form_fields.html" %}
      <button class="btn primary block" type="submit">Enregistrer</button>
    </form>
    <p style="text-align:center;margin-top:1rem"><a href="{% url 'dashboard' %}">Retour</a></p>
  </div>
</div>
</body>
</html>
